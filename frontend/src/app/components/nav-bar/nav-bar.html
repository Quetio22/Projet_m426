<header class="header">
  <nav class="nav-bar" aria-label="Navigation principale">
    <a class="brand" routerLink="/" aria-label="Accueil MessApp">
      <span class="title">MessApp</span>
    </a>

    <div class="actions">
      @if (isLoggedIn()) {
        <button class="button button--login" type="button" routerLink="/conversations">
          Conversation
        </button>
        <button class="button button--login" type="button" routerLink="/profile">
          Profil
        </button>
        <button class="button button--logout" type="button" (click)="logout()">
          Déconnexion
        </button>
      } @else {
        <button class="button button--login" type="button" routerLink="/login">
          Se connecter
        </button>
        <button class="button button--register" type="button" routerLink="/register">
          S'inscrire
        </button>
      }
    </div>
  </nav>
</header>
